# Paths are relative to the FIRST Compose file: stage 1's compose.yaml.
services:
  silver:
    image: apache/spark:3.5.8-scala2.12-java17-python3-r-ubuntu
    profiles: ["tools"]
    user: "185:185"
    environment:
      HOME: /tmp
      PYSPARK_PYTHON: python3
      PYTHONUNBUFFERED: "1"
      SPARK_LOCAL_IP: 127.0.0.1
      BRONZE_PATH: /opt/project/data/bronze/orders
      SILVER_ROOT: /opt/project/data/silver
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.sql.shuffle.partitions=2
    command: ["/opt/project/silver-jobs/bronze_to_silver.py"]
    volumes:
      - ../shop-data-pipeline-stage3-addon/spark:/opt/project/silver-jobs:ro
      - ./data:/opt/project/data
    depends_on:
      spark-storage-init:
        condition: service_completed_successfully
